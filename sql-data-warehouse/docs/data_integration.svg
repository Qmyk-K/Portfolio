<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="480" fill="#ffffff"/>
  <text x="30" y="40" font-size="26" font-weight="700" fill="#1a1a1a">Model integracji</text>
  <text x="30" y="62" font-size="13" fill="#555555">Jak lacza sie tabele zrodlowe z CRM i ERP</text>

  <rect x="150" y="90" width="130" height="40" fill="#b1ddf0" stroke="#10739e" rx="6"/>
  <text x="215" y="115" font-size="16" font-weight="700" text-anchor="middle" fill="#0a3a52">CRM</text>

  <rect x="720" y="90" width="130" height="40" fill="#fad7ac" stroke="#b46504" rx="6"/>
  <text x="785" y="115" font-size="16" font-weight="700" text-anchor="middle" fill="#5a3a00">ERP</text>

  <!-- CRM tables -->
  <g>
    <rect x="60" y="160" width="220" height="60" fill="#b1ddf0" stroke="#10739e" rx="6"/>
    <text x="170" y="178" font-size="12" font-weight="700" text-anchor="middle" fill="#0a3a52">crm_sales_details</text>
    <text x="170" y="196" font-size="11" text-anchor="middle" fill="#0a3a52">prd_key, cst_id</text>
    <rect x="55" y="146" width="230" height="18" fill="#e1d5e7" stroke="#9673a6" rx="4"/>
    <text x="170" y="159" font-size="10" text-anchor="middle" fill="#4a3057">SALES</text>
  </g>

  <g>
    <rect x="200" y="250" width="220" height="60" fill="#b1ddf0" stroke="#10739e" rx="6"/>
    <text x="310" y="268" font-size="12" font-weight="700" text-anchor="middle" fill="#0a3a52">crm_prd_info</text>
    <text x="310" y="286" font-size="11" text-anchor="middle" fill="#0a3a52">prd_id</text>
    <rect x="195" y="236" width="230" height="18" fill="#fad9d5" stroke="#ae4132" rx="4"/>
    <text x="310" y="249" font-size="10" text-anchor="middle" fill="#7a2c1e">PRODUCT</text>
  </g>

  <g>
    <rect x="200" y="340" width="220" height="60" fill="#b1ddf0" stroke="#10739e" rx="6"/>
    <text x="310" y="358" font-size="12" font-weight="700" text-anchor="middle" fill="#0a3a52">crm_cust_info</text>
    <text x="310" y="376" font-size="11" text-anchor="middle" fill="#0a3a52">cst_id, cst_key</text>
    <rect x="195" y="404" width="230" height="18" fill="#d5e8d4" stroke="#82b366" rx="4"/>
    <text x="310" y="417" font-size="10" text-anchor="middle" fill="#3a5c2c">CUSTOMER</text>
  </g>

  <!-- ERP tables -->
  <g>
    <rect x="720" y="160" width="220" height="60" fill="#fad7ac" stroke="#b46504" rx="6"/>
    <text x="830" y="178" font-size="12" font-weight="700" text-anchor="middle" fill="#5a3a00">erp_px_cat_g1v2</text>
    <text x="830" y="196" font-size="11" text-anchor="middle" fill="#5a3a00">id</text>
    <rect x="715" y="146" width="230" height="18" fill="#fad9d5" stroke="#ae4132" rx="4"/>
    <text x="830" y="159" font-size="10" text-anchor="middle" fill="#7a2c1e">PRODUCT</text>
  </g>

  <g>
    <rect x="720" y="250" width="220" height="60" fill="#fad7ac" stroke="#b46504" rx="6"/>
    <text x="830" y="268" font-size="12" font-weight="700" text-anchor="middle" fill="#5a3a00">erp_cust_az12</text>
    <text x="830" y="286" font-size="11" text-anchor="middle" fill="#5a3a00">cid</text>
    <rect x="715" y="236" width="230" height="18" fill="#d5e8d4" stroke="#82b366" rx="4"/>
    <text x="830" y="249" font-size="10" text-anchor="middle" fill="#3a5c2c">CUSTOMER</text>
  </g>

  <g>
    <rect x="720" y="340" width="220" height="60" fill="#fad7ac" stroke="#b46504" rx="6"/>
    <text x="830" y="358" font-size="12" font-weight="700" text-anchor="middle" fill="#5a3a00">erp_loc_a101</text>
    <text x="830" y="376" font-size="11" text-anchor="middle" fill="#5a3a00">cid</text>
    <rect x="715" y="404" width="230" height="18" fill="#d5e8d4" stroke="#82b366" rx="4"/>
    <text x="830" y="417" font-size="10" text-anchor="middle" fill="#3a5c2c">CUSTOMER</text>
  </g>

  <!-- connectors -->
  <g stroke="#888888" fill="none" stroke-width="1.5">
    <path d="M420 280 C 550 280, 590 190, 720 190"/>
    <path d="M420 370 C 550 370, 590 280, 720 280"/>
    <path d="M420 375 C 560 375, 600 370, 720 370"/>
  </g>

  <text x="30" y="455" font-size="11" fill="#777777">Klucze tekstowe (cst_key / cid) laczace CRM z ERP nie maja identycznego formatu - roznice usuwa dopiero warstwa silver.</text>
</svg>
