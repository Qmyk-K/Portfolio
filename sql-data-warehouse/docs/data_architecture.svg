<svg viewBox="0 0 1160 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1160" height="640" fill="#ffffff"/>

  <text x="30" y="45" font-size="30" font-weight="700" fill="#1a1a1a">Architektura danych</text>
  <text x="30" y="70" font-size="15" fill="#555555">Medallion Architecture: Bronze &#8594; Silver &#8594; Gold</text>

  <!-- Sources column -->
  <text x="40" y="110" font-size="20" font-weight="600" fill="#1a1a1a">Zrodla</text>
  <rect x="30" y="130" width="170" height="470" fill="none" stroke="#999999" stroke-dasharray="6 4" rx="6"/>
  <g>
    <rect x="60" y="170" width="110" height="80" fill="#fdf0e0" stroke="#b46504" rx="6"/>
    <text x="115" y="205" font-size="13" text-anchor="middle" fill="#5a3a00" font-weight="600">CRM</text>
    <text x="115" y="225" font-size="11" text-anchor="middle" fill="#5a3a00">pliki CSV</text>
  </g>
  <g>
    <rect x="60" y="450" width="110" height="80" fill="#fdf0e0" stroke="#b46504" rx="6"/>
    <text x="115" y="485" font-size="13" text-anchor="middle" fill="#5a3a00" font-weight="600">ERP</text>
    <text x="115" y="505" font-size="11" text-anchor="middle" fill="#5a3a00">pliki CSV</text>
  </g>

  <!-- Warehouse column -->
  <text x="250" y="110" font-size="20" font-weight="600" fill="#1a1a1a">SQL Server: Data Warehouse</text>
  <rect x="240" y="130" width="700" height="470" fill="none" stroke="#999999" stroke-dasharray="6 4" rx="6"/>

  <!-- Bronze -->
  <rect x="265" y="150" width="200" height="40" fill="#fad7ac" stroke="#b46504" rx="6"/>
  <text x="365" y="175" font-size="15" text-anchor="middle" font-weight="700" fill="#5a3a00">Bronze Layer</text>
  <rect x="265" y="210" width="200" height="360" fill="none" stroke="#ffb570" rx="6"/>
  <text x="365" y="235" font-size="12" text-anchor="middle" fill="#5a3a00">Surowe dane (as-is)</text>
  <text x="280" y="260" font-size="11" fill="#5a3a00">Obiekt: tabele</text>
  <text x="280" y="280" font-size="11" fill="#5a3a00">Ladowanie: full load</text>
  <text x="280" y="298" font-size="11" fill="#5a3a00">(truncate + insert)</text>
  <text x="280" y="326" font-size="11" fill="#5a3a00">Bez transformacji</text>
  <text x="280" y="344" font-size="11" fill="#5a3a00">Model danych: brak</text>

  <!-- Silver -->
  <rect x="490" y="150" width="200" height="40" fill="#e8e8e8" stroke="#666666" rx="6"/>
  <text x="590" y="175" font-size="15" text-anchor="middle" font-weight="700" fill="#333333">Silver Layer</text>
  <rect x="490" y="210" width="200" height="360" fill="none" stroke="#bbbbbb" rx="6"/>
  <text x="590" y="235" font-size="12" text-anchor="middle" fill="#333333">Dane oczyszczone</text>
  <text x="505" y="260" font-size="11" fill="#333333">Obiekt: tabele</text>
  <text x="505" y="280" font-size="11" fill="#333333">Ladowanie: full load</text>
  <text x="505" y="298" font-size="11" fill="#333333">(truncate + insert)</text>
  <text x="505" y="326" font-size="11" fill="#333333">Czyszczenie, standaryzacja,</text>
  <text x="505" y="342" font-size="11" fill="#333333">normalizacja, kolumny</text>
  <text x="505" y="358" font-size="11" fill="#333333">wyliczane, wzbogacanie</text>
  <text x="505" y="384" font-size="11" fill="#333333">Model danych: brak</text>

  <!-- Gold -->
  <rect x="715" y="150" width="200" height="40" fill="#fff2cc" stroke="#d6b656" rx="6"/>
  <text x="815" y="175" font-size="15" text-anchor="middle" font-weight="700" fill="#6b5900">Gold Layer</text>
  <rect x="715" y="210" width="200" height="360" fill="none" stroke="#e0cf7a" rx="6"/>
  <text x="815" y="235" font-size="12" text-anchor="middle" fill="#6b5900">Dane gotowe biznesowo</text>
  <text x="730" y="260" font-size="11" fill="#6b5900">Obiekt: widoki</text>
  <text x="730" y="280" font-size="11" fill="#6b5900">Bez ladowania</text>
  <text x="730" y="306" font-size="11" fill="#6b5900">Integracja danych,</text>
  <text x="730" y="322" font-size="11" fill="#6b5900">agregacje, logika biznesowa</text>
  <text x="730" y="348" font-size="11" fill="#6b5900">Model danych:</text>
  <text x="730" y="364" font-size="11" fill="#6b5900">schemat gwiazdy,</text>
  <text x="730" y="380" font-size="11" fill="#6b5900">tabele plaskie/zagregowane</text>

  <!-- Consume column -->
  <text x="985" y="110" font-size="20" font-weight="600" fill="#1a1a1a">Konsumpcja</text>
  <rect x="970" y="130" width="170" height="470" fill="none" stroke="#999999" stroke-dasharray="6 4" rx="6"/>
  <g>
    <rect x="995" y="180" width="120" height="60" fill="#e9f3ff" stroke="#2a6fbb" rx="6"/>
    <text x="1055" y="215" font-size="12" text-anchor="middle" fill="#1a3f66">BI i raporty</text>
  </g>
  <g>
    <rect x="995" y="270" width="120" height="60" fill="#e9f3ff" stroke="#2a6fbb" rx="6"/>
    <text x="1055" y="305" font-size="12" text-anchor="middle" fill="#1a3f66">Zapytania SQL ad-hoc</text>
  </g>
  <g>
    <rect x="995" y="360" width="120" height="60" fill="#e9f3ff" stroke="#2a6fbb" rx="6"/>
    <text x="1055" y="395" font-size="12" text-anchor="middle" fill="#1a3f66">Machine Learning</text>
  </g>

  <!-- arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555555"/>
    </marker>
  </defs>
  <path d="M200 350 H240" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M465 350 H490" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M690 350 H715" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M940 350 H970" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
